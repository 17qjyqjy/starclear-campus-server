function hotPostScore(p,scope='all'){

 if(scope==='day' && ageH>24)return Math.round(base*.42);
 if(scope==='rising')return Math.round(base+(base-(p.hotHistory||0))*1.45+Math.max(0,12-ageH)*18);
 if(scope==='college' && user(p.authorId).major?.split('·')[0]===me().major?.split('·')[0])return base+120;

ass="act ${p.coinedBy?.includes(me().id)?'coined':''}" data-action="coin" data-id="${p.id}">🪙 ${p.coins}</button><button class="act" data-action="chat" data-id="${u.id}">私信</button><button class="act" data-action="report" data-id="${p.id}">举报</button></div></section><section class="panel"><div class="sectionHead"><h3>评论 ${p.comments.length}</h3><div class="commentTools"><span class="floorTag">${view.commentSort==='new'?'最新排序':'神评优先'}</span><button class="link" data-action="sort-comments" data-id="${p.id}">${view.commentSort==='new'?'按热度':'按最新'}</button></div></div><form class="searchBig" id="commentForm"><input id="commentInput" placeholder="友善评论，支持楼中楼回复和评论点赞"><button>发送</button></form><div>${comments.map((c,i)=>commentHtml(c,i)).join('')||'<p class="muted">还没有评论，来抢沙发。</p>'}</div></section><section class="panel"><div class="sectionHead"><h3>相关推荐</h3></div><div class="feed">${postList(state.posts.filter(x=>x.id!==p.id&&(x.circleId===p.circleId||x.board===p.board||x.tags.some(t=>(p.tags||[]).includes(t)))).slice(0,3))}</div></section>`; const f=$('#commentForm'); if(f)f.onsubmit=e=>{e.preventDefault(); addComment(p.id,$('#commentInput').value);}; }

function editCircleRules(id){ const c=circle(id); const notice=prompt('修改表达吧公告',c.notice||'')||c.notice; const rules=prompt('修改吧规，用逗号分隔', (c.rules||defaultCircleRules(c)).join('，')); c.notice=notice; if(rules)c.rules=rules.split(/[，,]/).map(x=>x.trim()).filter(Boolean).slice(0,6); notify('已更新表达吧公告/吧规','📌','circle'); save(); renderCircle(); }

function openCompose(opts={}){ composeImages=[]; const defaultCircle=opts.circleId||view.circleId||'c_hall'; const defaultBoard=opts.board||btnBoardFallback()||'生活'; const anon=opts.anon?'checked':''; openModal(`<div class="modalHead"><h3>${opts.anon?'匿名树洞':'发布新帖'}</h3><button class="close" data-action="close">×</button></div><form class="form" id="composeForm"><div class="field"><label>标题</label><input id="composeTitle" placeholder="一句话说清楚重点" required></div><div class="field"><label>正文</label><textarea id="composeBody" placeholder="写清时间、地点、需求、故事或梗点"></textarea></div><div class="field"><label>表达吧</label><select id="composeCircle">${state.circles.map(c=>`<option value="${c.id}" ${c.id===defaultCircle?'selected':''}>${c.emoji} ${c.name}</option>`).join('')}</select></div><div class="field"><label>分区</label><select id="composeBoard">${BOARDS.filter(x=>x!=='全部').map(b=>`<option ${b===defaultBoard?'selected':''}>${b}</option>`).join('')}</select></div><div class="field"><label>可见范围</label><select id="composeVisibility"><option>全校可见</option><option>仅同校可见</option><option>仅本院可见</option><option>仅本表达吧可见</option></select></div><div class="field"><label>标签，逗号分隔</label><input id="composeTags" placeholder="例如：期末,求助,二手,夜跑搭子"></div><label class="switch"><input type="checkbox" id="composeAnon" ${anon}> 匿名发布（显示校内认证匿名，不显示真实昵称）</label><div class="field"><label>上传图片，可多选</label><input id="composeFiles" type="file" accept="image/*" multiple><div id="uploadStatus" class="uploadStatus">未选择图片；不传图会自动生成校园封面。</div><div class="previewRow" id="composePreview"></div></div><button class="full" id="composeSubmit">发布到大厅</button></form>`); $('#composeFiles').onchange=handleComposeFiles; $('#composeForm').onsubmit=submitCompose; }
function btnBoardFallback(){ return view.tab==='搭子'?'搭子':null; }
async function handleComposeFiles(e){ const files=Array.from(e.target.files||[]).slice(0,4); const status=$('#uploadStatus'); const preview=$('#composePreview'); composeUploading=true; composeImages=[]; status.textContent='正在压缩图片，请稍等…'; preview.innerHTML=''; try{ for(const f of files){ const data=await compressImage(f,760,.58); composeImages.push(data); preview.insertAdjacentHTML('beforeend',`<span class="previewWrap"><img class="preview" src="${data}"><button type="button" class="removeImg" data-action="remove-compose-img" data-index="${composeImages.length-1}">×</button></span>`); } status.textContent=`已准备 ${composeImages.length} 张图片，可发布`; }catch(err){ status.textContent='图片读取失败，请重选'; } composeUploading=false; }
function submitCompose(e){ e.preventDefault(); if(composeUploading)return toast('图片还在处理，请等预览出现'); const title=$('#composeTitle').value.trim(); const body=$('#composeBody').value.trim(); if(!title&&!body)return toast('标题或正文至少写一个'); const board=$('#composeBoard').value; const circleId=$('#composeCircle').value; const tags=$('#composeTags').value.split(/[,，\s#]+/).map(x=>x.trim()).filter(Boolean); if(!tags.includes(board))tags.unshift(board); if(board==='搭子'&&!tags.includes('搭子'))tags.unshift('搭子'); const imgs=composeImages.length?[...composeImages]:[poster(title||board, board==='兼职'?'💼':board==='学习'?'📚':board==='树洞'?'🕳️':board==='搭子'?'🤝':'🌸','#fff0fa','#e7fbff')]; const anonymous=$('#composeAnon').checked; const p={id:uid('p'),title:title||`${board}新帖`,body:body||'刚刚发布了一条校园动态。',authorId:me().id,circleId,board,tags,images:imgs,created:now(),likes:0,coins:0,collects:0,views:1,likedBy:[],collectedBy:[],coinedBy:[],essence:false,anonymous,visibility:$('#composeVisibility')?.value||'全校可见',trust:anonymous?'校内认证匿名':'校内认证',hotHistory:0,comments:[]}; state.posts.unshift(p); circle(circleId).members+=1; notify('新帖《'+p.title+'》已发布，并进入大厅最新流','✨','post'); save(); closeModal(); view.tab=board==='搭子'?'搭子':'最新'; view.board='全部'; view.detailId=p.id; view.page='detail'; render(); setTimeout(()=>toast('发布成功，已同步到大厅/表达吧/个人主页'),80); }
function compressImage(file,max=760,quality=.58){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onerror=reject; reader.onload=()=>{ const img=new Image(); img.onload=()=>{ const scale=Math.min(1,max/Math.max(img.width,img.height)); const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)); const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h; const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); let out=canvas.toDataURL('image/jpeg',quality); if(out.length>180000){ out=canvas.toDataURL('image/jpeg',.42); } resolve(out); }; img.onerror=()=>resolve(reader.result); img.src=reader.result; }; reader.readAsDataURL(file); }); }

  var t = getToken();
  if(!t){ document.getElementById("auth-root").style.display="block"; return; }
  api("/user/me").then(async function(u){
    if(!u||!u.id){ clearToken(); document.getElementById("auth-root").style.display="block"; return; }
    document.getElementById("app-root").style.display="block";
    if(window.__initApp) window.__initApp()["catch"](function(e){});
  }).catch(function(){ clearToken(); document.getElementById("auth-root").style.display="block"; });
})();

document.getElementById("auth-tab-login").addEventListener("click",function(){
  document.getElementById("auth-extra").style.display="none";
});
document.getElementById("auth-tab-register").addEventListener("click",function(){
  document.getElementById("auth-extra").style.display="block";
});
document.getElementById("auth-form").addEventListener("submit",async function(e){
  e.preventDefault();
  var n=document.getElementById("auth-input-name").value.trim();
  var p=document.getElementById("auth-input-pass").value;
  var m=document.getElementById("auth-input-major").value.trim();
  var login=document.getElementById("auth-extra").style.display==="none";
  var er=document.getElementById("auth-error");er.style.display="none";
  try{
    var r = login
      ? await api("/auth/login",{method:"POST",body:JSON.stringify({name:n,password:p})})
      : await api("/auth/register",{method:"POST",body:JSON.stringify({name:n,password:p,major:m||""})});
    if(r.token) setToken(r.token);
    document.getElementById("auth-root").style.display="none";
    document.getElementById("app-root").style.display="block";
    if(window.__initApp) window.__initApp()["catch"](function(e){});
  }catch(e){ er.textContent=e.message||"登录失败"; er.style.display="block"; }
});</script>
